<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>百度空间归档</title>
<link rel="icon" href="icon.png" type="image/png">
<link rel="stylesheet" href="brand.css">
<link rel="stylesheet" href="app.css">
</head>
<body>

<svg style="display:none">
  <symbol id="i-home" viewBox="0 0 24 24"><path fill="currentColor" d="M12 3 3 10v11h6v-6h6v6h6V10z"/></symbol>
  <symbol id="i-inbox" viewBox="0 0 24 24"><path fill="currentColor" d="M4 4h16a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1m1 9v5h14v-5h-4a3 3 0 0 1-6 0zm0-7v5h6l3 3 3-3h2V6z"/></symbol>
  <symbol id="i-image" viewBox="0 0 24 24"><path fill="currentColor" d="M4 4h16a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1m1 2v9.6l3.5-3.4 4 3.9L15 13l4 3.9V6zM8 7.5A1.5 1.5 0 1 1 8 10a1.5 1.5 0 0 1 0-2.5"/></symbol>
  <symbol id="i-sync" viewBox="0 0 24 24"><path fill="currentColor" d="M12 4a8 8 0 0 1 7.4 5h-2.2A6 6 0 0 0 6.7 10H9l-3.5 4L2 10h2.6A8 8 0 0 1 12 4m0 16a8 8 0 0 1-7.4-5h2.2A6 6 0 0 0 17.3 14H15l3.5-4L22 14h-2.6A8 8 0 0 1 12 20"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2 1 21h22zm0 5 7.5 12h-15zM11 10v5h2v-5zm0 6v2h2v-2z"/></symbol>
  <symbol id="i-export" viewBox="0 0 24 24"><path fill="currentColor" d="M12 3v10.2l3.1-3.1 1.4 1.4L11 17l-5.5-5.5 1.4-1.4L10 13.2V3zM4 19h16v2H4z"/></symbol>
  <symbol id="i-cog" viewBox="0 0 24 24"><path fill="currentColor" d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8m0 2a2 2 0 1 1 0 4 2 2 0 0 1 0-4m-1.6-8h3.2l.4 2.5 1.7 1 2.3-1 1.6 2.8-1.9 1.6v2l1.9 1.6-1.6 2.8-2.3-1-1.7 1-.4 2.5h-3.2l-.4-2.5-1.7-1-2.3 1L4.4 16l1.9-1.6v-2L4.4 10.8 6 8l2.3 1 1.7-1z"/></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24"><path fill="currentColor" d="M12.7 2a9 9 0 1 0 9.3 11.3A7.5 7.5 0 0 1 12.7 2"/></symbol>
  <symbol id="i-sun" viewBox="0 0 24 24"><path fill="currentColor" d="M12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10m0-5 1.8 2.6L12 5.2 10.2 4.6zM12 22l-1.8-2.6 1.8.6 1.8-.6zM2 12l2.6-1.8-.6 1.8.6 1.8zm20 0-2.6 1.8.6-1.8-.6-1.8zM5 5l3 .8-1.4 1.4L5.8 8zm14 14-3-.8 1.4-1.4L18.2 16zM19 5l-.8 3-1.4-1.4L16 5.8zM5 19l.8-3 1.4 1.4L8 18.2z"/></symbol>
  <symbol id="i-user" viewBox="0 0 24 24"><path fill="currentColor" d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8m0 2c-4 0-8 2-8 4.5V21h16v-2.5c0-2.5-4-4.5-8-4.5"/></symbol>
  <symbol id="i-db" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2c4.4 0 8 1.3 8 3v14c0 1.7-3.6 3-8 3s-8-1.3-8-3V5c0-1.7 3.6-3 8-3m0 2c-3.5 0-6 .9-6 1s2.5 1 6 1 6-.9 6-1-2.5-1-6-1M6 7.5V11c0 .1 2.5 1 6 1s6-.9 6-1V7.5c-1.5.6-3.7 1-6 1s-4.5-.4-6-1m0 6V17c0 .1 2.5 1 6 1s6-.9 6-1v-3.5c-1.5.6-3.7 1-6 1s-4.5-.4-6-1"/></symbol>
  <symbol id="i-doc" viewBox="0 0 24 24"><path fill="currentColor" d="M6 2h8l5 5v15H6zm7 1.5V8h4.5zM8 11h8v2H8zm0 4h8v2H8z"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><path d="m16 16 4 4m-2-9a7 7 0 1 1-14 0 7 7 0 0 1 14 0Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
  <symbol id="i-panel" viewBox="0 0 24 24"><path d="M4 5h16v14H4zM10 5v14" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></symbol>
</svg>

<div class="app-shell" id="shell">
  <aside class="sidebar" aria-label="应用导航">
    <div class="brand">
      <img class="brand-mark" src="icon.png" width="34" height="34" alt="">
      <span class="brand-copy">百度空间归档</span>
    </div>
    <nav class="side-nav" aria-label="主导航">
      <button type="button" class="nav-item" data-page="dashboard" aria-label="归档概览" title="归档概览"><svg aria-hidden="true"><use href="#i-home"/></svg><span>归档概览</span></button>
      <button type="button" class="nav-item" data-page="archives" aria-label="文章" title="文章"><svg aria-hidden="true"><use href="#i-inbox"/></svg><span>文章</span></button>
      <button type="button" class="nav-item" data-page="media" aria-label="图片" title="图片"><svg aria-hidden="true"><use href="#i-image"/></svg><span>图片</span></button>
      <button type="button" class="nav-item" data-page="missing" aria-label="缺失内容" title="缺失内容"><svg aria-hidden="true"><use href="#i-alert"/></svg><span>缺失内容</span></button>
      <button type="button" class="nav-item" data-page="export" aria-label="导出" title="导出"><svg aria-hidden="true"><use href="#i-export"/></svg><span>导出</span></button>
    </nav>
    <div class="sidebar-footer">
      <button type="button" class="nav-item" data-page="settings" aria-label="设置" title="设置"><svg aria-hidden="true"><use href="#i-cog"/></svg><span>设置</span></button>
      <button type="button" class="nav-item" id="toggleSidebar" aria-expanded="true" aria-label="折叠侧边栏" title="切换侧边栏"><svg aria-hidden="true"><use href="#i-panel"/></svg><span>折叠侧栏</span></button>
    </div>
  </aside>
  <div class="workspace">
    <header class="topbar">
      <h1 id="pageTitle" tabindex="-1">归档概览</h1>
      <div class="topbar-actions">
        <button type="button" id="taskIndicator" class="task-indicator" data-goto="dashboard" hidden><i aria-hidden="true"></i><span>任务进行中</span></button>
        <button type="button" class="icon-btn" id="themeBtn" title="切换主题" aria-label="切换主题"><svg width="17" height="17" aria-hidden="true"><use href="#i-moon" id="themeIcon"/></svg></button>
        <div class="account">
          <button type="button" class="account-chip" id="accountBtn" aria-controls="accountMenu" aria-expanded="false">
            <svg width="16" height="16" aria-hidden="true"><use href="#i-user"/></svg><span id="acctName">登录百度</span>
          </button>
          <div id="accountMenu" class="account-menu" hidden>
            <button type="button" data-goto="settings">账号设置</button>
            <button type="button" data-act="login">重新登录</button>
            <button type="button" data-act="logout">退出登录</button>
          </div>
        </div>
      </div>
    </header>
    <main class="content" id="content"></main>
  </div>
</div>

<div class="toasts" id="toasts"></div>
<script src="app.js"></script>
</body>
</html>
