<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>百度空间归档</title>
<link rel="stylesheet" href="app.css">
</head>
<body>

<svg style="display:none">
  <symbol id="i-box" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2 3 7v10l9 5 9-5V7zm0 2.3 6.5 3.6L12 11.5 5.5 7.9zM5 9.7l6 3.3v6.6l-6-3.3zm8 9.9V13l6-3.3v6.6z"/></symbol>
  <symbol id="i-home" viewBox="0 0 24 24"><path fill="currentColor" d="M12 3 3 10v11h6v-6h6v6h6V10z"/></symbol>
  <symbol id="i-inbox" viewBox="0 0 24 24"><path fill="currentColor" d="M4 4h16a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1m1 9v5h14v-5h-4a3 3 0 0 1-6 0zm0-7v5h6l3 3 3-3h2V6z"/></symbol>
  <symbol id="i-image" viewBox="0 0 24 24"><path fill="currentColor" d="M4 4h16a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1m1 2v9.6l3.5-3.4 4 3.9L15 13l4 3.9V6zM8 7.5A1.5 1.5 0 1 1 8 10a1.5 1.5 0 0 1 0-2.5"/></symbol>
  <symbol id="i-sync" viewBox="0 0 24 24"><path fill="currentColor" d="M12 4a8 8 0 0 1 7.4 5h-2.2A6 6 0 0 0 6.7 10H9l-3.5 4L2 10h2.6A8 8 0 0 1 12 4m0 16a8 8 0 0 1-7.4-5h2.2A6 6 0 0 0 17.3 14H15l3.5-4L22 14h-2.6A8 8 0 0 1 12 20"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2 1 21h22zm0 5 7.5 12h-15zM11 10v5h2v-5zm0 6v2h2v-2z"/></symbol>
  <symbol id="i-export" viewBox="0 0 24 24"><path fill="currentColor" d="M12 3v10.2l3.1-3.1 1.4 1.4L11 17l-5.5-5.5 1.4-1.4L10 13.2V3zM4 19h16v2H4z"/></symbol>
  <symbol id="i-cog" viewBox="0 0 24 24"><path fill="currentColor" d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8m0 2a2 2 0 1 1 0 4 2 2 0 0 1 0-4m-1.6-8h3.2l.4 2.5 1.7 1 2.3-1 1.6 2.8-1.9 1.6v2l1.9 1.6-1.6 2.8-2.3-1-1.7 1-.4 2.5h-3.2l-.4-2.5-1.7-1-2.3 1L4.4 16l1.9-1.6v-2L4.4 10.8 6 8l2.3 1 1.7-1z"/></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24"><path fill="currentColor" d="M12.7 2a9 9 0 1 0 9.3 11.3A7.5 7.5 0 0 1 12.7 2"/></symbol>
  <symbol id="i-sun" viewBox="0 0 24 24"><path fill="currentColor" d="M12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10m0-5 1.8 2.6L12 5.2 10.2 4.6zM12 22l-1.8-2.6 1.8.6 1.8-.6zM2 12l2.6-1.8-.6 1.8.6 1.8zm20 0-2.6 1.8.6-1.8-.6-1.8zM5 5l3 .8-1.4 1.4L5.8 8zm14 14-3-.8 1.4-1.4L18.2 16zM19 5l-.8 3-1.4-1.4L16 5.8zM5 19l.8-3 1.4 1.4L8 18.2z"/></symbol>
  <symbol id="i-user" viewBox="0 0 24 24"><path fill="currentColor" d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8m0 2c-4 0-8 2-8 4.5V21h16v-2.5c0-2.5-4-4.5-8-4.5"/></symbol>
  <symbol id="i-db" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2c4.4 0 8 1.3 8 3v14c0 1.7-3.6 3-8 3s-8-1.3-8-3V5c0-1.7 3.6-3 8-3m0 2c-3.5 0-6 .9-6 1s2.5 1 6 1 6-.9 6-1-2.5-1-6-1M6 7.5V11c0 .1 2.5 1 6 1s6-.9 6-1V7.5c-1.5.6-3.7 1-6 1s-4.5-.4-6-1m0 6V17c0 .1 2.5 1 6 1s6-.9 6-1v-3.5c-1.5.6-3.7 1-6 1s-4.5-.4-6-1"/></symbol>
  <symbol id="i-doc" viewBox="0 0 24 24"><path fill="currentColor" d="M6 2h8l5 5v15H6zm7 1.5V8h4.5zM8 11h8v2H8zm0 4h8v2H8z"/></symbol>
</svg>

<div class="titlebar-drag"></div>

<div class="app-shell" id="shell">
  <aside class="sidebar">
    <div class="brand">
      <button class="brand-mark" id="toggleSidebar" title="折叠侧边栏"><svg width="17" height="17"><use href="#i-box"/></svg></button>
      <div class="brand-copy"><strong>百度空间归档</strong><span>BAIDU ARCHIVE</span></div>
    </div>
    <nav class="side-nav">
      <a class="active" data-page="dashboard"><span class="ico"><svg width="17" height="17"><use href="#i-home"/></svg></span><span>概览</span></a>
      <a data-page="archives"><span class="ico"><svg width="17" height="17"><use href="#i-inbox"/></svg></span><span>归档内容</span></a>
      <a data-page="media"><span class="ico"><svg width="17" height="17"><use href="#i-image"/></svg></span><span>媒体</span></a>
      <a data-page="tasks"><span class="ico"><svg width="17" height="17"><use href="#i-sync"/></svg></span><span>归档任务</span></a>
      <a data-page="skips"><span class="ico"><svg width="17" height="17"><use href="#i-alert"/></svg></span><span>异常跳过</span></a>
      <a data-page="export"><span class="ico"><svg width="17" height="17"><use href="#i-export"/></svg></span><span>导出</span></a>
    </nav>
    <div class="sidebar-footer">
      <a data-page="settings"><span class="ico"><svg width="17" height="17"><use href="#i-cog"/></svg></span><span>设置</span></a>
    </div>
  </aside>

  <div class="workspace">
    <header class="topbar">
      <div>
        <p class="eyebrow">BAIDU ARCHIVE</p>
        <h1 id="pageTitle">概览</h1>
      </div>
      <div class="topbar-actions">
        <button class="icon-btn" id="themeBtn" title="切换主题"><svg width="16" height="16"><use href="#i-moon" id="themeIcon"/></svg></button>
        <button class="account-chip" id="accountBtn">
          <span class="account-avatar"><svg width="15" height="15"><use href="#i-user"/></svg></span>
          <span class="account-copy"><strong id="acctName">尚未登录</strong><small id="acctSub">点击导入 Cookie</small></span>
        </button>
      </div>
    </header>

    <main class="content" id="content"></main>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
