name: Release checks
on: [push, pull_request, workflow_dispatch]
jobs:
  test:
    # Ubuntu 26.04 has no Python 3.9 build in the setup-python manifest.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.14']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest
      - run: node --test tests/test_dashboard.cjs
      - run: python -m baidu_archive --help
      - run: python scripts/check_release_package.py
  macos-desktop:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: python -m pip install --upgrade pip
      - run: python scripts/check_release_package.py --native-gui
