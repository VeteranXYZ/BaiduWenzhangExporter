[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "baidu-archive"
version = "0.1.0"
description = "百度空间历史内容抢救 / 归档工具：RAW-first、可恢复、可验证的本地数字档案"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "markdownify>=0.13",
    "Pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# 原生窗口界面。CLI 不依赖它，缺失时 `gui` 子命令会给出安装提示。
gui = ["pywebview>=6.0"]

[project.scripts]
baidu-archive = "baidu_archive.cli:main"

[tool.setuptools]
packages = ["baidu_archive"]

[tool.setuptools.package-data]
baidu_archive = [
    "web/*.css", "web/*.js",
    "dashboard/*.html", "dashboard/*.css", "dashboard/*.js",
    "ui/*.html", "ui/*.css", "ui/*.js", "ui/icon.png", "ui/icon.ico", "ui/icon.icns",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff.lint.per-file-ignores]
# pytest 跨文件共享 fixture 的标准写法是 import 后作为参数使用，
# ruff 会误报 F401/F811。测试目录豁免这两条，其余规则照常。
"tests/*" = ["F401", "F811"]
